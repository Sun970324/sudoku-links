<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku League — 코드 열기</title>
<!--
  Shared-code landing page. Staged here, published elsewhere: this file is
  copied to the root of the Sun970324/sudoku-links repository, which GitHub
  Pages serves at the custom domain https://sudoku.jaywithme.com/ (see
  README.md in this folder). Nothing renders or copies it automatically — this
  copy is the single source, so edit here and re-copy.

  It is the fallback half of the deep link. On a phone with the app installed,
  https://sudoku.jaywithme.com/open.html?c=<code> never gets this far —
  iOS Universal Links / Android App Links hand it to the app. Whoever does land
  here gets an automatic attempt (Android: intent:// with Play fallback, iOS:
  scheme try then App Store after 1.6s — Safari shows a brief "invalid address"
  alert when the app is absent; unavoidable, the standard tradeoff), with the
  buttons and the raw code kept as the manual fallback.
-->
<meta name="description" content="초대 코드로 친구와 같은 퍼즐을 풀며 실시간 대결하는 스도쿠 앱, Sudoku League.">
<!--
  Open Graph / Twitter card. This is what KakaoTalk, iMessage, Discord and the
  rest render when the link is pasted into a chat — without it they show a bare
  URL, which is the moment an invite gets ignored.

  Every URL here must be absolute: a crawler has no page context to resolve a
  relative path against. og:image therefore points at the domain root, so
  og_image.png has to be published alongside this file (README.md §2). Kakao
  caches the result per URL — after changing any of this, clear it at
  https://developers.kakao.com/tool/debugger/sharing or the old card sticks.

  og:url stays the bare landing URL rather than the shared ?c=<code> one: the
  card is about the app, not the code, and a per-code URL would fragment the
  crawler cache for no gain.
-->
<meta property="og:type" content="website">
<meta property="og:url" content="https://sudoku.jaywithme.com/open.html">
<meta property="og:title" content="Sudoku League — 스도쿠 리그">
<meta property="og:description" content="친구가 보낸 퍼즐이 도착했어요. 같은 퍼즐로 실시간 대결하세요.">
<meta property="og:image" content="https://sudoku.jaywithme.com/og_image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sudoku League — 스도쿠 리그">
<meta name="twitter:description" content="친구가 보낸 퍼즐이 도착했어요. 같은 퍼즐로 실시간 대결하세요.">
<meta name="twitter:image" content="https://sudoku.jaywithme.com/og_image.png">
<style>
  body { max-width: 32rem; margin: 0 auto; padding: 3rem 1.25rem 4rem;
         font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: #1c1c1e; background: #fff; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p.lead { color: #55555c; margin: 0 0 2rem; }
  .btn { display: block; margin: .6rem 0; padding: .85rem 1rem;
         border: 1px solid #d1d1d6; border-radius: .7rem;
         text-decoration: none; color: #1c1c1e; background: #f6f6f8; }
  .btn.primary { background: #0b62d0; border-color: #0b62d0; color: #fff;
                 font-weight: 600; }
  .code-block { margin: 2rem 0 0; }
  .code-block h2 { font-size: .95rem; font-weight: 600; color: #55555c;
                   margin: 0 0 .5rem; }
  code { display: block; padding: .8rem; border-radius: .7rem;
         background: #f0f0f3; font: 15px/1.5 ui-monospace, SFMono-Regular,
         Menlo, monospace; word-break: break-all; }
  button.copy { margin-top: .6rem; padding: .5rem 1rem; font: inherit;
                border: 1px solid #d1d1d6; border-radius: .7rem;
                background: #fff; color: #1c1c1e; cursor: pointer; }
  .hint { font-size: .85rem; color: #77777e; margin-top: 2.5rem; }
  #missing { display: none; }
  @media (prefers-color-scheme: dark) {
    body { color: #ececf1; background: #17171a; }
    p.lead, .code-block h2 { color: #a0a0a8; }
    .btn { background: #232327; border-color: #3a3a3e; color: #ececf1; }
    .btn.primary { background: #0b62d0; border-color: #0b62d0; color: #fff; }
    code { background: #232327; }
    button.copy { background: #232327; border-color: #3a3a3e; color: #ececf1; }
    .hint { color: #86868e; }
  }
</style>
</head>
<body>
<h1>Sudoku League</h1>
<p class="lead" id="lead">초대 링크를 받았어요.</p>

<div id="found">
  <a class="btn primary" id="openApp" href="#">앱에서 열기</a>
  <!-- APPSTORE_URL: numeric App Store id 6794986328 (store_listing.md /
       STATUS_ARCHIVE 08-14, confirmed against itunes.apple.com/lookup). -->
  <a class="btn" href="https://apps.apple.com/app/id6794986328">App Store에서 받기</a>
  <a class="btn" href="https://play.google.com/store/apps/details?id=jaywithme.sudoku">Google Play에서 받기</a>

  <div class="code-block">
    <h2>코드</h2>
    <code id="code"></code>
    <button class="copy" id="copy" type="button">코드 복사</button>
  </div>
  <p class="hint">앱이 열리지 않으면 코드를 복사해 앱의 <b>코드 입력</b> 화면에 붙여넣으세요.</p>
</div>

<div id="missing">
  <p>이 링크에는 코드가 없어요. 친구가 보낸 링크를 다시 확인해 주세요.</p>
  <a class="btn" href="https://apps.apple.com/app/id6794986328">App Store에서 받기</a>
  <a class="btn" href="https://play.google.com/store/apps/details?id=jaywithme.sudoku">Google Play에서 받기</a>
</div>

<script>
  // Same parameter for both kinds of code — a 6-char room code and a longer
  // base62 puzzle code. The app tells them apart on its own, so this page
  // never needs to know which one it is holding.
  var code = new URLSearchParams(location.search).get('c');
  code = code === null ? '' : code.trim();

  var PLAY_URL = 'https://play.google.com/store/apps/details?id=jaywithme.sudoku';
  var APPSTORE_URL = 'https://apps.apple.com/app/id6794986328';

  if (code === '') {
    document.getElementById('found').style.display = 'none';
    document.getElementById('missing').style.display = 'block';
    document.getElementById('lead').textContent = '';
  } else {
    var scheme = 'sudokuleague://open?c=' + encodeURIComponent(code);
    // Chrome's native app-or-store branch: opens the app when installed,
    // otherwise goes to the fallback URL. No timers, no guessing.
    var intentUrl = 'intent://open?c=' + encodeURIComponent(code) +
      '#Intent;scheme=sudokuleague;package=jaywithme.sudoku;' +
      'S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end';

    var ua = navigator.userAgent;
    var isAndroid = /android/i.test(ua);
    var isIos = /iphone|ipad|ipod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    document.getElementById('code').textContent = code;
    document.getElementById('openApp').href = isAndroid ? intentUrl : scheme;
    document.getElementById('copy').addEventListener('click', function () {
      var done = function () { document.getElementById('copy').textContent = '복사했어요'; };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(done, function () {});
      }
    });

    // Auto-attempt. A phone with the app installed normally never reaches
    // this page (Universal/App Links open the app straight from the tap), so
    // whoever lands here is most likely app-less — but in-app browsers and
    // long-press-opened links do land here with the app present, hence: try
    // the app first, fall to the store only when nothing claimed the jump.
    if (isAndroid) {
      document.getElementById('lead').textContent = '앱으로 연결 중…';
      location.replace(intentUrl);
    } else if (isIos) {
      document.getElementById('lead').textContent = '앱으로 연결 중…';
      var fallback = setTimeout(function () {
        location.href = APPSTORE_URL;
      }, 1600);
      // If the app took over, this page is hidden before the timer fires.
      var cancel = function () {
        if (document.hidden) clearTimeout(fallback);
      };
      document.addEventListener('visibilitychange', cancel);
      window.addEventListener('pagehide', function () { clearTimeout(fallback); });
      location.href = scheme;
    }
  }
</script>
</body>
</html>
